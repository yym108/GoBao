syntax = "proto3";

package gobao.payment.v1;

option go_package = "github.com/yym108/gobao-proto/gen/go/gobao/payment/v1;paymentv1";

service PaymentService {
  rpc GetPayment(GetPaymentRequest) returns (GetPaymentResponse);
  rpc GetPaymentByOrder(GetPaymentByOrderRequest) returns (GetPaymentByOrderResponse);
  rpc MockConfirmPayment(MockConfirmPaymentRequest) returns (MockConfirmPaymentResponse);
}

message Payment {
  int64 id = 1;
  string payment_no = 2;
  int64 order_id = 3;
  string order_no = 4;
  int64 user_id = 5;
  int64 amount = 6;
  string status = 7;
  string channel = 8;
  int64 created_at = 9;
  int64 updated_at = 10;
  int64 paid_at = 11;
}

message GetPaymentRequest {
  int64 user_id = 1;
  int64 payment_id = 2;
}

message GetPaymentResponse {
  Payment payment = 1;
}

message GetPaymentByOrderRequest {
  int64 user_id = 1;
  int64 order_id = 2;
}

message GetPaymentByOrderResponse {
  Payment payment = 1;
}

message MockConfirmPaymentRequest {
  int64 user_id = 1;
  int64 payment_id = 2;
  string result = 3;
}

message MockConfirmPaymentResponse {
  Payment payment = 1;
}
